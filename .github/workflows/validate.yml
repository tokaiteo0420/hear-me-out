name: validate-hear-me-out

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python tools/validate_repo.py
      - name: Test validator failure detection
        run: python tests/test_validator.py
